name: Daily scrape

# 每個交易日收盤後抓取當月資料，驗證爬蟲對真實網站仍然有效。
# 只跑證交所這支（純 requests），因為兩支 Selenium 爬蟲需要瀏覽器，
# 在 CI 上跑既慢又容易因為網站狀態而不穩定。
on:
  schedule:
    - cron: '30 10 * * 1-5'      # UTC 10:30 = 台灣時間 18:30，收盤後
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      # 只有「程式壞了」才顯示紅燈。證交所擋雲端 IP、或當月還沒有資料，都是
      # 來源端的狀況，標成 annotation 留下紀錄但不算失敗——否則真正的爬蟲破壞
      # 會被淹沒在這類雜訊裡。離開碼的定義見 main.py 的模組 docstring。
      - name: 抓取當月資料
        run: |
          MONTH=$(date -u -d '+8 hours' +%Y-%m)
          code=0
          python main.py twse --stock 2330 --start "$MONTH" --end "$MONTH" || code=$?
          case "$code" in
            0) echo "::notice::${MONTH} 抓取成功" ;;
            2) echo "::warning::來源不可用（被擋、超時或連不上），非程式問題" ;;
            3) echo "::warning::${MONTH} 沒有資料（休市或尚未公布）" ;;
            *) echo "::error::爬蟲需要修：離開碼 ${code}"; exit "$code" ;;
          esac

      - name: 上傳 CSV
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: twse-${{ github.run_number }}
          path: data/*.csv
          if-no-files-found: warn
          retention-days: 14
